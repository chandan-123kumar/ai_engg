<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Qwen3-0.6B Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #container {
      width: 100%;
      max-width: 760px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }

    h1 {
      font-size: 18px;
      color: #aaa;
      text-align: center;
      letter-spacing: 1px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 8px 0;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      background: #1e3a5f;
      align-self: flex-end;
      color: #d0e8ff;
    }

    .assistant {
      background: #1e1e1e;
      align-self: flex-start;
      color: #e0e0e0;
      border: 1px solid #2a2a2a;
    }

    .typing::after {
      content: "▋";
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #input-row {
      display: flex;
      gap: 8px;
    }

    #prompt {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
      resize: none;
      height: 48px;
    }

    #prompt:focus { border-color: #555; }

    #send {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
    }

    #send:disabled { background: #1a1a1a; color: #555; cursor: not-allowed; }
    #send:hover:not(:disabled) { background: #1d4ed8; }

    #status {
      text-align: center;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>Chandan's GPT Model</h1>
    <div id="messages"></div>
    <div id="input-row">
      <textarea id="prompt" placeholder="Type a message..." rows="1"></textarea>
      <button id="send">Send</button>
    </div>
    <div id="status">Ready</div>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function send() {
      const prompt = promptEl.value.trim();
      if (!prompt) return;

      promptEl.value = "";
      sendBtn.disabled = true;
      statusEl.textContent = "Generating...";

      addMessage("user", prompt);
      const reply = addMessage("assistant", "");
      reply.classList.add("typing");

      try {
        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, max_tokens: 200 }),
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let text = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split("\n");

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const token = line.slice(6);
            if (token === "[DONE]") break;
            text += token;
            reply.textContent = text;
            messages.scrollTop = messages.scrollHeight;
          }
        }
      } catch (err) {
        reply.textContent = "Error: " + err.message;
      }

      reply.classList.remove("typing");
      sendBtn.disabled = false;
      statusEl.textContent = "Ready";
      promptEl.focus();
    }

    sendBtn.addEventListener("click", send);
    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
